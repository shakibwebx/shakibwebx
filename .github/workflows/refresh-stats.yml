name: Refresh GitHub stats

on:
  # Runs on every push to main so the cards fill in without anyone having
  # to trigger the workflow by hand. The refresh commit is made with
  # GITHUB_TOKEN, which GitHub does not allow to re-trigger workflows, so
  # this cannot loop.
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stat cards
        env:
          STATS_USER: ${{ github.repository_owner }}
          # Optional: a PAT with read:user unlocks the contribution
          # calendar, which the default token may not be allowed to read.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_stats.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/stats.svg assets/streak.svg assets/top-langs.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh GitHub stat cards"
            git push
          fi
